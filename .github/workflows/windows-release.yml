name: Windows release checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pruebas rápidas en Linux: detectan dependencias de plataforma y no intervienen en la compilación ni en la release.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python tests
        run: python -m unittest discover tests -v
      - name: JavaScript tests
        run: node --test tests/test_*.cjs
      - name: Robustez (medición informativa)
        run: python scripts/medir_robustez.py >> "$GITHUB_STEP_SUMMARY"

  # Validación con herramientas externas reales: pdflatex (exportación LaTeX) y hojas de cálculo (CSV).
  externos:
    runs-on: ubuntu-24.04
    # La descarga de TeX Live depende del espejo de Ubuntu; el 2026-11-24 tardó más de 25 min dos veces.
    timeout-minutes: 60
    env:
      REQUIERE_EXTERNOS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar TeX Live, LibreOffice Calc y Gnumeric
        run: |
          sudo apt-get update
          sudo apt-get install -y -o Acquire::Retries=3 --no-install-recommends texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-lang-spanish libreoffice-calc-nogui gnumeric
      - name: Exportaciones con herramientas reales
        run: python -m unittest discover tests -p "test_externo_*.py" -v
      - name: Compilación del corpus y del adversario Unicode
        run: python -m unittest tests.test_exportacion_modulos -v

  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: python -m pip install -r requirements-windows-lock.txt
      - name: Python tests
        run: python -m unittest discover tests -v
      - name: JavaScript tests
        shell: pwsh
        run: node --test (Get-ChildItem tests/test_*.cjs).FullName
      - name: Build executable and setup
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Test portable, install, reinstall and uninstall
        shell: pwsh
        run: ./scripts/test_windows_package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: calculadora-windows-x64
          if-no-files-found: error
          path: |
            dist/*-setup.exe
            dist/*-portable.zip
            dist/SHA256SUMS.txt
